<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Live Stream – LED Display</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    iframe { position:fixed; inset:0; display:block; width:100%; height:100%; border:0; background:#000; }
    #message { position:fixed; inset:0; display:grid; place-items:center; padding:24px;
      color:#fff; background:#111; font:20px/1.5 system-ui,sans-serif; text-align:center; }
  </style>
</head>
<body>
  <div id="message">กรุณาระบุลิงก์ YouTube หรือ Facebook ต่อท้าย URL ของเว็บไซต์</div>
  <iframe id="player" title="Live video"
    allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write; web-share"
    allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="display:none"></iframe>
  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get("v");
    const facebookUrl = params.get("fb");
    const player = document.getElementById("player");
    const message = document.getElementById("message");

    if (videoId && /^[A-Za-z0-9_-]{6,20}$/.test(videoId)) {
      player.src = "https://www.youtube.com/embed/" + encodeURIComponent(videoId) +
        "?autoplay=1&mute=1&controls=0&rel=0&playsinline=1";
      player.style.display = "block";
      message.style.display = "none";
    } else if (facebookUrl) {
      try {
        const parsed = new URL(facebookUrl);
        const allowedHost = parsed.hostname === "facebook.com" || parsed.hostname.endsWith(".facebook.com");
        if (!allowedHost || parsed.protocol !== "https:") throw new Error("Invalid Facebook URL");
        player.src = "https://www.facebook.com/plugins/video.php?href=" +
          encodeURIComponent(parsed.href) + "&show_text=false&width=960&height=480&autoplay=true";
        player.style.display = "block";
        message.style.display = "none";
      } catch (e) {
        message.textContent = "ลิงก์ Facebook ไม่ถูกต้อง กรุณาตรวจสอบ URL อีกครั้ง";
      }
    }
  </script>
</body>
</html>
